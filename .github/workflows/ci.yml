name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Règle AGENTS.md §4 : lint + tests + build obligatoires à chaque modification.
      - name: Lint (Oxlint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build (tsc + Vite)
        run: npm run build
